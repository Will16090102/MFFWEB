<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Group Peru | Cotizador Premium</title>
    <style>
        :root {
            --sea-blue: #002d54;
            --sea-red: #ef4d48;
            --sea-red-hover: #d6413c;
            --glass-bg: rgba(255, 255, 255, 0.92);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* --- FONDO DINÁMICO --- */
        .hero-viewport {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('fondo.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-viewport::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0, 45, 84, 0.85) 0%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 1150px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            align-items: center;
        }

        /* --- SECCIÓN IZQUIERDA (TEXTO) --- */
        .brand-content {
            color: white;
            animation: slideLeft 1s ease-out;
        }

        .brand-content img.logo {
            max-width: 240px;
            margin-bottom: 30px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        .brand-content h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            margin: 0 0 25px 0;
            letter-spacing: -1px;
        }

        .brand-content p {
            font-size: 1.3rem;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 500px;
        }

        /* --- PANEL DE COTIZACIÓN (DERECHA) --- */
        .quote-panel {
            background: var(--glass-bg);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .quote-panel h2 {
            margin: 0 0 30px 0;
            font-size: 1.8rem;
            color: var(--sea-blue);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quote-panel h2::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, var(--sea-red), transparent);
        }

        .input-box { margin-bottom: 20px; }

        .input-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.3s;
            box-sizing: border-box;
            background: white;
        }

        .input-box input:focus {
            outline: none;
            border-color: var(--sea-blue);
            box-shadow: 0 0 0 4px rgba(0, 45, 84, 0.1);
        }

        /* SERVICIOS UPGRADE */
        .service-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .service-card {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: #f8fafc;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .service-card:hover {
            border-color: #cbd5e0;
            background: #f1f5f9;
        }

        .service-card input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            accent-color: var(--sea-red);
        }

        .service-card span {
            font-size: 0.95rem;
            font-weight: 500;
            color: #2d3748;
        }

        /* BOTÓN CTA */
        .btn-premium {
            background: var(--sea-red);
            color: white;
            border: none;
            width: 100%;
            padding: 20px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 10px 20px -5px rgba(239, 77, 72, 0.4);
            animation: pulse-shadow 2s infinite;
        }

        .btn-premium:hover {
            background: var(--sea-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(239, 77, 72, 0.5);
        }

        /* ANIMACIONES */
        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(239, 77, 72, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(239, 77, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 77, 72, 0); }
        }

        /* RESPONSIVE */
        @media (max-width: 992px) {
            .main-container { grid-template-columns: 1fr; gap: 40px; }
            .brand-content { text-align: center; }
            .brand-content p { margin: 0 auto 30px; }
            .brand-content h1 { font-size: 2.8rem; }
            .quote-panel { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="hero-viewport">
        <div class="main-container">
            <div class="brand-content">
                <img src="https://seagroupperu.com/wp-content/uploads/2023/logo-sea-group.png" alt="Sea Group" class="logo">
                <h1>Tu carga, <br>nuestra prioridad.</h1>
                <p>Optimizamos tu cadena de suministro con asesoría experta y soluciones logísticas a medida. 🚢</p>
            </div>

            <div class="quote-panel">
                <h2>Cotiza ahora</h2>
                <form id="waSeaForm">
                    <div class="input-box">
                        <label>Nombre y Apellido</label>
                        <input type="text" id="nombre" placeholder="Ej: Wilmer Anton" autocomplete="off">
                    </div>

                    <div class="input-box">
                        <label>WhatsApp Corporativo</label>
                        <input type="tel" id="telefono" placeholder="Ej: 999 999 999">
                    </div>

                    <label class="input-box" style="margin-bottom: 10px;">
                        <label>Selecciona un Servicio</label>
                    </label>
                    
                    <div class="service-list">
                        <label class="service-card">
                            <input type="radio" name="servicio" value="Agenciamiento de Aduana">
                            <span>Agenciamiento de Aduana</span>
                        </label>
                        <label class="service-card">
                            <input type="radio" name="servicio" value="Agenciamiento de Carga internacional" checked>
                            <span>Agenciamiento de Carga internacional</span>
                        </label>
                        <label class="service-card">
                            <input type="radio" name="servicio" value="Asesoría en importación y exportación">
                            <span>Asesoría en importación y exportación</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-premium" id="btnEnviar">Solicitar Cotización</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('waSeaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            
            const nombre = document.getElementById('nombre').value.trim() || "Cliente Interesado";
            const tel = document.getElementById('telefono').value.trim() || "No especificado";
            const servicio = document.querySelector('input[name="servicio"]:checked').value;

            const mensaje = `*SEA GROUP PERU - NUEVA COTIZACIÓN*%0A%0A` +
                            `*Cliente:* ${nombre}%0A` +
                            `*WhatsApp:* ${tel}%0A` +
                            `*Servicio solicitado:* ${servicio}%0A%0A` +
                            `_Enviado desde el Cotizador Web._`;

            btn.innerText = "Abriendo WhatsApp...";
            setTimeout(() => {
                window.open(`https://wa.me/51934290174?text=${mensaje}`, '_blank');
                btn.innerText = "Solicitar Cotización";
            }, 800);
        });
    </script>

</body>
</html>
