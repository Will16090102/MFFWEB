<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-up a WhatsApp</title>
    <style>
        :root {
            --rojo-corporativo: rgb(239, 77, 72);
            --fondo-lila: #d1a6d1;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Contenedor principal */
        .popup-card {
            background-color: var(--fondo-lila);
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        /* Botón cerrar */
        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--rojo-corporativo);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Encabezado */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .emoji { font-size: 45px; }

        .title h1 {
            color: var(--rojo-corporativo);
            margin: 0;
            font-size: 35px;
            font-family: Georgia, serif;
        }

        .title p {
            margin: 0;
            font-weight: bold;
            font-size: 14px;
            color: #444;
        }

        /* Estilo de inputs */
        .input-group {
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid var(--rojo-corporativo);
            border-color: transparent;
        }

        /* Botón WhatsApp */
        .btn-send {
            background-color: var(--rojo-corporativo);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
            text-transform: uppercase;
        }

        .btn-send:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="popup-card">
        <button class="btn-close">×</button>
        
        <div class="header">
            <span class="emoji">🤔</span>
            <div class="title">
                <h1>Ups!!!</h1>
                <p>¿Aún no tienes un sitio web?</p>
            </div>
        </div>

        <form id="waForm">
            <div class="input-group">
                <input type="text" id="nom" placeholder="Nombre" required>
            </div>
            <div class="input-group">
                <input type="text" id="ape" placeholder="Apellidos" required>
            </div>
            <div class="input-group">
                <input type="email" id="mail" placeholder="Correo electrónico" required>
            </div>
            <div class="input-group">
                <input type="tel" id="tel" placeholder="Número de celular" required>
            </div>
            <div class="input-group">
                <input type="text" id="rub" placeholder="Rubro de mercado" required>
            </div>

            <button type="submit" class="btn-send">Enviar a WhatsApp</button>
        </form>
    </div>
