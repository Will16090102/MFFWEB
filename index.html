<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Group Peru - Cotizador</title>
    <style>
        :root {
            --sea-blue: #002d54; /* Azul profundo de la web */
            --sea-red: #ef4d48;
            --sea-light-blue: #0056b3;
            --bg-gray: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--sea-blue);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        /* Contenedor Principal estilo Landing Page */
        .main-wrapper {
            width: 90%;
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* Columna Izquierda: Texto e Imagen */
        .info-section {
            flex: 1;
            min-width: 320px;
            padding-right: 40px;
        }

        .info-section img.logo {
            max-width: 200px;
            margin-bottom: 30px;
        }

        .info-section h1 {
            font-size: 48px;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .info-section p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* Columna Derecha: Formulario estilo Flota */
        .form-card {
            background: white;
            color: #333;
            padding: 35px;
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .form-card h2 {
            margin-top: 0;
            font-size: 18px;
            color: var(--sea-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--sea-red);
            display: inline-block;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input[type="text"], 
        .form-group input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--sea-light-blue);
            outline: none;
        }

        /* Checkboxes/Radios estilo Requisitos */
        .custom-option {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border: 1px solid #eee;
            font-size: 14px;
        }

        .custom-option input { margin-right: 12px; }

        .btn-action {
            background-color: var(--sea-red);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-action:hover {
            background-color: #d6413c;
            transform: translateY(-2px);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .info-section { padding-right: 0; text-align: center; margin-bottom: 40px; }
            .info-section h1 { font-size: 32px; }
            .form-card { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="info-section">
            <img src="https://seagroupperu.com/wp-content/uploads/2023/logo-sea-group.png" alt="Sea Group Logo" class="logo">
            <h1>Logística de importación eficiente</h1>
            <p>Simplificamos tus operaciones aduaneras y de carga internacional. Empieza hoy tu próxima importación con expertos.</p>
            <img src="https://seagroupperu.com/wp-content/uploads/2023/bg-hero-1.png" alt="Carga" style="width: 100%; border-radius: 10px;">
        </div>

        <div class="form-card">
            <h2>¡Solicita tu Cotización!</h2>
            
            <form id="waSeaForm">
                <div class="form-group">
                    <label>Nombre para contactarnos *</label>
                    <input type="text" id="nombre" placeholder="Ej: Wilmer Anton">
                </div>

                <div class="form-group">
                    <label>Número de WhatsApp *</label>
                    <input type="tel" id="telefono" placeholder="Ej: 999999999">
                </div>

                <label style="font-size: 14px; font-weight: bold; display: block; margin-bottom: 10px;">Servicio requerido:</label>
                
                <label class="custom-option">
                    <input type="radio" name="servicio" value="Carga internacional" checked> Agenciamiento de Carga
                </label>
                <label class="custom-option">
                    <input type="radio" name="servicio" value="Aduanas"> Agenciamiento de Aduana
                </label>

                <label style="font-size: 14px; font-weight: bold; display: block; margin-bottom: 10px; margin-top: 15px;">Perfil de importador:</label>
                
                <label class="custom-option">
                    <input type="checkbox" id="checkImportado"> Ya he realizado importaciones antes
                </label>

                <button type="submit" class="btn-action" id="btnWsp">¡Quiero mi cotización!</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('waSeaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnWsp');
            
            const nombre = document.getElementById('nombre').value.trim();
            const tel = document.getElementById('telefono').value.trim();
            const servicio = document.querySelector('input[name="servicio"]:checked').value;
            const yaImporto = document.getElementById('checkImportado').checked ? "Sí" : "No";

            let text = "";
            if (!nombre && !tel) {
                text = "Hola Sea Group Peru, estoy interesado en recibir asesoría para importar de manera eficiente.";
            } else {
                text = `*SOLICITUD DE COTIZACIÓN*%0A%0A` +
                       `*Nombre:* ${nombre || "Interesado"}%0A` +
                       `*Teléfono:* ${tel || "No especificado"}%0A` +
                       `*Servicio:* ${servicio}%0A` +
                       `*Importador previo:* ${yaImporto}`;
            }

            btn.innerText = "Abriendo WhatsApp...";
            setTimeout(() => {
                window.open(`https://wa.me/51934290174?text=${text}`, '_blank');
                btn.innerText = "¡Quiero mi cotización!";
            }, 800);
        });
    </script>
</body>
</html>
