<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Group Peru | Landing Page</title>
    <style>
        :root {
            --sea-blue: #00509d; /* El azul real de la web */
            --sea-red: #e31e24;  /* El rojo de los botones y logo */
            --sea-red-hover: #c4191f;
            --bg-light: #f4f7f9;
            --text-main: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        /* --- HERO SECTION --- */
        .hero-section {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Usamos una imagen de fondo de alta calidad de logística */
            background-image: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .hero-section::before {
            content: "";
            position: absolute;
            inset: 0;
            /* Overlay con el azul de la marca para coherencia visual */
            background: linear-gradient(135deg, rgba(0, 80, 157, 0.85) 0%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        /* --- LADO IZQUIERDO: TEXTO --- */
        .brand-info {
            color: white;
        }

        .logo-main {
            width: 240px;
            margin-bottom: 30px;
        }

        .brand-info h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .brand-info p {
            font-size: 1.2rem;
            line-height: 1.5;
            max-width: 480px;
            opacity: 0.9;
        }

        /* --- LADO DERECHO: FORMULARIO --- */
        .quote-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .quote-card h2 {
            color: var(--sea-blue);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quote-card h2::after {
            content: "";
            height: 3px;
            background: var(--sea-red);
            flex: 1;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--sea-blue);
            box-shadow: 0 0 0 3px rgba(0, 80, 157, 0.1);
        }

        /* --- SERVICIOS (Cards pequeñas) --- */
        .services-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 20px;
        }

        .service-option {
            cursor: pointer;
        }

        .service-option input {
            display: none;
        }

        .service-box {
            display: block;
            padding: 10px 15px;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #444;
            transition: 0.2s;
        }

        .service-option input:checked + .service-box {
            background: var(--sea-blue);
            color: white;
            border-color: var(--sea-blue);
        }

        /* --- BOTÓN --- */
        .btn-submit {
            width: 100%;
            background: var(--sea-red);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(227, 30, 36, 0.3);
        }

        .btn-submit:hover {
            background: var(--sea-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(227, 30, 36, 0.4);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; text-align: center; }
            .brand-info h1 { font-size: 2.5rem; }
            .brand-info p { margin: 0 auto; }
            .quote-card h2::after { display: none; }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="container">
            <div class="brand-info">
                <img src="logo.png" alt="Sea Group Peru" class="logo-main">
                <h1>Tu carga,<br>nuestra prioridad.</h1>
                <p>Optimizamos tu cadena de suministro con asesoría experta y soluciones logísticas a medida. 🚢</p>
            </div>

            <div class="quote-card">
                <h2>Cotiza ahora</h2>
                <form id="seaForm">
                    <div class="form-group">
                        <label>Nombre y Apellido</label>
                        <input type="text" id="nombre" placeholder="Ej: Wilmer Anton" required>
                    </div>

                    <div class="form-group">
                        <label>WhatsApp Corporativo</label>
                        <input type="tel" id="telefono" placeholder="999 999 999" required>
                    </div>

                    <div class="form-group">
                        <label>¿Has importado anteriormente?</label>
                        <select id="importador" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Si, soy importador frecuente">Sí, soy importador frecuente</option>
                            <option value="He importado pocas veces">He importado pocas veces</option>
                            <option value="No, sería mi primera vez">No, sería mi primera vez</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Selecciona un servicio</label>
                        <div class="services-grid">
                            <label class="service-option">
                                <input type="radio" name="servicio" value="Agenciamiento de Aduana" checked>
                                <span class="service-box">Agenciamiento de Aduana</span>
                            </label>
                            <label class="service-option">
                                <input type="radio" name="servicio" value="Agenciamiento de Carga Internacional">
                                <span class="service-box">Carga Internacional</span>
                            </label>
                            <label class="service-option">
                                <input type="radio" name="servicio" value="Asesoría en Imp/Exp">
                                <span class="service-box">Asesoría en Importación y Exportación</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="btnEnviar">Solicitar Cotización</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('seaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const tel = document.getElementById('telefono').value;
            const exp = document.getElementById('importador').value;
            const servicio = document.querySelector('input[name="servicio"]:checked').value;

            const mensaje = `*NUEVA SOLICITUD DE COTIZACIÓN*%0A` +
                            `*Cliente:* ${nombre}%0A` +
                            `*WhatsApp:* ${tel}%0A` +
                            `*Experiencia:* ${exp}%0A` +
                            `*Servicio:* ${servicio}`;

            const btn = document.getElementById('btnEnviar');
            btn.innerText = "Abriendo WhatsApp...";

            setTimeout(() => {
                window.open(`https://wa.me/51934290174?text=${mensaje}`, '_blank');
                btn.innerText = "Solicitar Cotización";
            }, 800);
        });
    </script>

</body>
</html>
