<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Group Peru - Importación Inteligente</title>
    <style>
        :root {
            --sea-blue: #002d54;
            --sea-red: #ef4d48;
            --overlay: rgba(0, 24, 46, 0.75); /* Desvanecido oscuro azulado */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* --- FONDO CON IMAGEN Y DESVANECIDO --- */
        .hero-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('fondo.png'); /* Tu imagen de fondo */
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .hero-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay); /* El ligero desvanecido */
            z-index: -1;
        }

        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .content-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 40px;
        }

        /* --- ANIMACIONES TIPO FLOTA --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* Columna Izquierda */
        .info-section {
            flex: 1;
            min-width: 300px;
            color: white;
            animation: fadeInLeft 1s ease-out;
        }

        .info-section img.logo {
            max-width: 220px;
            margin-bottom: 20px;
        }

        .info-section h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .info-section p {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Columna Derecha (Formulario) */
        .form-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            animation: fadeInUp 1s ease-out 0.3s backwards;
            color: #333;
        }

        .form-card h2 {
            margin: 0 0 25px 0;
            font-size: 1.5rem;
            color: var(--sea-blue);
            border-left: 5px solid var(--sea-red);
            padding-left: 15px;
        }

        .form-group { margin-bottom: 15px; }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            background: #f9f9f9;
        }

        /* Opciones Estilo Checklist */
        .check-option {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .check-option:hover { background: #eee; }
        .check-option input { margin-right: 12px; width: 18px; height: 18px; }

        /* Botón con Pulso */
        .btn-wsp {
            background: var(--sea-red);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: 0.3s;
            animation: pulse 2s infinite;
        }

        .btn-wsp:hover {
            background: #d6413c;
            animation: none;
            transform: scale(1.02);
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .info-section h1 { font-size: 2.5rem; text-align: center; }
            .info-section { text-align: center; }
            .content-container { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="hero-background"></div>
    <div class="hero-overlay"></div>

    <div class="main-wrapper">
        <div class="content-container">
            <div class="info-section">
                <img src="https://seagroupperu.com/wp-content/uploads/2023/logo-sea-group.png" alt="Sea Group" class="logo">
                <h1>Importar nunca fue tan fácil</h1>
                <p>Expertos en agenciamiento de aduana y carga internacional. Tu mercancía en manos seguras, desde cualquier parte del mundo.</p>
            </div>

            <div class="form-card">
                <h2>Cotiza tu Importación</h2>
                <form id="waSeaForm">
                    <div class="form-group">
                        <label>Nombre y Apellido</label>
                        <input type="text" id="nombre" placeholder="Ej: Wilmer Anton">
                    </div>

                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="telefono" placeholder="Ej: 999 999 999">
                    </div>

                    <label style="font-weight:bold; font-size: 0.9rem; margin-bottom: 10px; display:block;">Servicio:</label>
                    <label class="check-option">
                        <input type="radio" name="servicio" value="Carga Internacional" checked> Carga Internacional
                    </label>
                    <label class="check-option">
                        <input type="radio" name="servicio" value="Aduanas"> Agenciamiento de Aduana
                    </label>

                    <label style="font-weight:bold; font-size: 0.9rem; margin-top: 15px; margin-bottom: 10px; display:block;">¿Ya ha importado antes?</label>
                    <label class="check-option">
                        <input type="checkbox" id="importadorPrevio"> Sí, tengo experiencia importando
                    </label>

                    <button type="submit" class="btn-wsp" id="btnEnviar">¡Quiero Asesoría!</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('waSeaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            
            const nombre = document.getElementById('nombre').value.trim() || "Interesado";
            const tel = document.getElementById('telefono').value.trim() || "No especificado";
            const servicio = document.querySelector('input[name="servicio"]:checked').value;
            const exp = document.getElementById('importadorPrevio').checked ? "Con experiencia" : "Sin experiencia";

            const mensaje = `*NUEVA COTIZACIÓN SEA GROUP*%0A%0A*Cliente:* ${nombre}%0A*WhatsApp:* ${tel}%0A*Servicio:* ${servicio}%0A*Perfil:* ${exp}`;

            btn.innerText = "Conectando...";
            setTimeout(() => {
                window.open(`https://wa.me/51934290174?text=${mensaje}`, '_blank');
                btn.innerText = "¡Quiero Asesoría!";
            }, 800);
        });
    </script>

</body>
</html>
