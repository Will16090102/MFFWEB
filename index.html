<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Group Peru - Cotizador Animado</title>
    <style>
        :root {
            --sea-red: rgb(239, 77, 72);
            --sea-blue: #003366;
            --bg-gray: #f9f9f9;
        }

        /* Keyframes para las animaciones */
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 77, 72, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 77, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 77, 72, 0); }
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .popup-card {
            background: white;
            width: 90%;
            max-width: 420px;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-top: 8px solid var(--sea-red);
            padding: 30px;
            position: relative;
            /* Animación de entrada */
            animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        h2 {
            color: var(--sea-blue);
            margin-top: 0;
            font-size: 22px;
            text-transform: uppercase;
            text-align: center;
            animation: fadeInUp 0.5s ease backwards;
            animation-delay: 0.2s;
        }

        .form-group {
            margin-bottom: 18px;
            /* Los campos aparecen escalonados */
            animation: fadeInUp 0.5s ease backwards;
        }

        /* Retrasos para cada campo */
        .f1 { animation-delay: 0.3s; }
        .f2 { animation-delay: 0.4s; }
        .f3 { animation-delay: 0.5s; }
        .f4 { animation-delay: 0.6s; }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: var(--bg-gray);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--sea-red);
            background-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .radio-group {
            display: flex;
            gap: 25px;
            margin-top: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .radio-option:hover { color: var(--sea-red); }

        .radio-option input {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
        }

        .btn-submit {
            background-color: var(--sea-red);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px; /* Más redondeado para look moderno */
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: 0.3s;
            animation: fadeInUp 0.5s ease backwards, pulse 2s infinite;
            animation-delay: 0.7s;
        }

        .btn-submit:hover {
            background-color: #c93a35;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="popup-card">
        <h2>Nueva Cotización</h2>
        
        <form id="waSeaForm">
            <div class="form-group f1">
                <label>Nombre y Apellido</label>
                <input type="text" id="nombreCompleto" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group f2">
                <label>N° de Teléfono</label>
                <input type="tel" id="telefono" placeholder="Ej. 934290174" required>
            </div>

            <div class="form-group f3">
                <label>Rubro de Mercado</label>
                <select id="rubro" required>
                    <option value="" disabled selected>Seleccione su rubro</option>
                    <option value="Tecnología">Tecnología / Electrónica</option>
                    <option value="Industrial">Industrial / Maquinaria</option>
                    <option value="Textil">Textil / Calzado</option>
                    <option value="Retail">Retail / Consumo masivo</option>
                    <option value="Otro">Otro rubro</option>
                </select>
            </div>

            <div class="form-group f4">
                <label>¿Ha importado antes?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="importado" value="Sí, con experiencia" required> Sí
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="importado" value="No, primera vez"> No
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Solicitar Propuesta vía WhatsApp</button>
        </form>
    </div>

    <script>
        document.getElementById('waSeaForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombreCompleto').value;
            const tel = document.getElementById('telefono').value;
            const rubro = document.getElementById('rubro').value;
            const importoAntes = document.querySelector('input[name="importado"]:checked').value;

            const phone = "51934290174";

            const text = `*COTIZACIÓN SEA GROUP PERU*%0A%0A` +
                         `*Cliente:* ${nombre}%0A` +
                         `*Teléfono:* ${tel}%0A` +
                         `*Rubro:* ${rubro}%0A` +
                         `*Importador previo:* ${importoAntes}`;

            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        });
    </script>

</body>
</html>
