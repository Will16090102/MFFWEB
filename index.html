<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Group Peru - Contacto Experto</title>
    <style>
        :root {
            --sea-red: #ef4d48;
            --sea-dark: #333333;
            --text-gray: #666666;
            --bg-light: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .popup-container {
            background: var(--bg-light);
            width: 95%;
            max-width: 500px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #000;
        }

        h1 {
            color: var(--sea-dark);
            font-size: 38px;
            margin: 0 0 20px 0;
            line-height: 1.1;
            font-weight: 800;
        }

        p {
            color: var(--text-gray);
            font-size: 15px;
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--sea-dark);
        }

        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            background-color: #fdfdfd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 18px;
        }

        .section-title {
            font-weight: bold;
            color: var(--sea-dark);
            margin: 10px 0 15px 0;
            display: block;
        }

        .services-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .service-option {
            display: flex;
            align-items: center;
            font-size: 15px;
            color: var(--sea-dark);
            cursor: pointer;
        }

        .service-option input {
            margin-right: 10px;
            width: 17px;
            height: 17px;
            accent-color: #007bff;
        }

        .btn-submit {
            background-color: var(--sea-red);
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background-color: #d6413c;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="popup-container">
        <div class="close-btn">×</div>
        
        <h1>¿Quieres importar de Manera Eficiente?</h1>
        <p>Déjanos tus datos y un experto te contactará para orientarte en tu proceso.</p>

        <form id="waSeaForm">
            <label class="input-label">Nombre y Apellido</label>
            <input type="text" id="nombre" placeholder="Ej. Wilmer Anton">

            <label class="input-label">N° de Teléfono</label>
            <input type="tel" id="telefono" placeholder="Ej. 934290174">

            <span class="section-title">Servicios de interés</span>
            <div class="services-group">
                <label class="service-option">
                    <input type="radio" name="servicio" value="Agenciamiento de Aduana"> Agenciamiento de Aduana
                </label>
                <label class="service-option">
                    <input type="radio" name="servicio" value="Agenciamiento de Carga internacional"> Agenciamiento de Carga internacional
                </label>
                <label class="service-option">
                    <input type="radio" name="servicio" value="Asesoría en importación y exportación"> Asesoría en importación y exportación
                </label>
                <label class="service-option">
                    <input type="radio" name="servicio" value="Servicio de transporte"> Servicio de transporte
                </label>
            </div>

            <button type="submit" class="btn-submit">Contactar con un experto</button>
        </form>
    </div>

    <script>
        document.getElementById('waSeaForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Captura de valores
            const nombre = document.getElementById('nombre').value.trim();
            const tel = document.getElementById('telefono').value.trim();
            const servicioSel = document.querySelector('input[name="servicio"]:checked');
            const servicio = servicioSel ? servicioSel.value : "";

            // Lógica de mensaje: Si todo está vacío, envía mensaje genérico
            let text = "";
            
            if (!nombre && !tel && !servicio) {
                text = "Hola, estoy interesado en sus servicios de importación eficiente. Me gustaría recibir más información.";
            } else {
                // Si hay datos, los organiza (usando "No especificado" si falta alguno individualmente)
                const n = nombre || "No especificado";
                const t = tel || "No especificado";
                const s = servicio || "No especificado";

                text = `*NUEVA SOLICITUD DE INFORMACIÓN*%0A%0A` +
                       `*Nombre:* ${n}%0A` +
                       `*Teléfono:* ${t}%0A` +
                       `*Servicio de interés:* ${s}%0A%0A` +
                       `Estoy interesado en recibir asesoría.`;
            }

            const phone = "51934290174"; 
            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        });
    </script>

</body>
</html>
