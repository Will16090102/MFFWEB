<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesta de Sitio Web - Pop Up</title>
    <style>
        :root {
            --primary-red: rgb(239, 77, 72);
            --bg-purple: #d1a6d1; /* El tono lila del fondo en la imagen */
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Contenedor del Pop-up */
        .popup-container {
            background-color: var(--bg-purple);
            width: 90%;
            max-width: 800px;
            padding: 40px;
            border-radius: 5px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Botón de cerrar */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--primary-red);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Encabezado */
        .header-section {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .emoji-thinker {
            font-size: 60px;
            margin-right: 20px;
        }

        .title-text h1 {
            color: var(--primary-red);
            margin: 0;
            font-size: 42px;
            font-family: 'Georgia', serif;
        }

        .title-text p {
            margin: 5px 0;
            font-weight: bold;
            font-size: 18px;
            color: #444;
        }

        .subtitle {
            margin-bottom: 30px;
            line-height: 1.4;
            color: #333;
        }

        /* Formulario */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .label-custom {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #444;
        }

        /* Botón de acción con el color solicitado */
        .submit-btn {
            grid-column: span 2;
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: fit-content;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            filter: brightness(1.1);
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .submit-btn { grid-column: 1; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="popup-container">
        <button class="close-btn">X</button>
        
        <div class="header-section">
            <div class="emoji-thinker">🤔</div>
            <div class="title-text">
                <h1>Ups!!!</h1>
                <p>¿Así que todavía no tienes un sitio web para tu negocio???</p>
            </div>
        </div>

        <p class="subtitle">Cuéntanos brevemente acerca de tu empresa o negocio para que podamos comenzar a pensar juntos una propuesta para tu sitio web.</p>

        <form>
            <div class="form-grid">
                <div class="inputs-left">
                    <input type="text" placeholder="Nombre y Apellido" style="margin-bottom: 10px;">
                    <input type="email" placeholder="Email" style="margin-bottom: 10px;">
                    <input type="text" placeholder="URL del sitio web" style="margin-bottom: 10px;">
                    <input type="text" placeholder="Empresa" style="margin-bottom: 10px;">
                    <input type="text" placeholder="Tu cargo en la empresa">
                </div>

                <div class="inputs-right">
                    <label class="label-custom">¿Cuán probable es que encares el proyecto de sitio web para tu negocio en el corto plazo?</label>
                    <select style="margin-bottom: 10px;">
                        <option>Elije tu respuesta</option>
                        <option>Muy probable</option>
                        <option>Tal vez pronto</option>
                        <option>Solo consulto</option>
                    </select>
                    <textarea placeholder="Cuéntanos de tu negocio"></textarea>
                </div>

                <button type="submit" class="submit-btn">Solicitar Propuesta</button>
            </div>
        </form>
    </div>

</body>
</html>
